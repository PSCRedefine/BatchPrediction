# Two services from one image. The console talks to the API over the compose
# network, which is why BATCH_PREDICTION_API_URL points at the service name
# rather than at localhost.

services:
  api:
    build: .
    image: batch-prediction:latest
    command: >
      uvicorn batch_prediction.api:app
      --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    healthcheck:
      # The console waits for this. /health stays serviceable even when the
      # model fails to load, so the check tests the model, not just the port.
      test: ["CMD", "python", "-c",
             "import urllib.request,json,sys;
              b=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'));
              sys.exit(0 if b['model_loaded'] and b['store_loaded'] else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  console:
    build: .
    image: batch-prediction:latest
    command: >
      streamlit run app.py
      --server.port 8501 --server.address 0.0.0.0
    environment:
      BATCH_PREDICTION_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
