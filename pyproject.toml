[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-prediction"
version = "1.0.0"
description = "Batch engagement prediction service and Streamlit console for Cognitive Shorts"
requires-python = ">=3.10,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
